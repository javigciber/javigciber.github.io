<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Javier González · Writeups de ciberseguridad</title>
<style>
:root{--bg:#f6f7f9;--surface:#fff;--text:#14181f;--muted:#5a6472;--line:#dde1e7;--accent:#2b5fd9;--accent-soft:#e6edfc;--code:#eef0f4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1319;--surface:#171c24;--text:#e8ebf0;--muted:#98a2b0;--line:#283040;--accent:#7ea2ff;--accent-soft:#1d2842;--code:#0b0e13;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1319;--surface:#171c24;--text:#e8ebf0;--muted:#98a2b0;--line:#283040;--accent:#7ea2ff;--accent-soft:#1d2842;--code:#0b0e13;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:32px 20px 64px}
header h1{font-size:1.9rem;margin:0 0 4px;letter-spacing:-.02em}
header p{margin:0;color:var(--muted)}
.links{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
.links a,.back{color:var(--accent);text-decoration:none;border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:8px;font-size:.9rem;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0 16px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:5px 13px;border-radius:999px;font-size:.85rem;cursor:pointer;font-family:inherit}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:12px;color:inherit;text-decoration:none}
.card:hover{border-color:var(--accent)}
.card h2{font-size:1.1rem;margin:0 0 4px}
.card p{margin:6px 0 10px;color:var(--muted);font-size:.95rem}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--muted)}
.tag{background:var(--accent-soft);color:var(--accent);padding:2px 9px;border-radius:999px}
.badge{border:1px dashed var(--muted);padding:1px 8px;border-radius:999px}
article{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 24px 24px;margin-top:16px}
article h1{font-size:1.6rem;margin:.8em 0 .2em;letter-spacing:-.01em}
article h2{font-size:1.2rem;margin:1.6em 0 .4em;padding-bottom:4px;border-bottom:1px solid var(--line)}
article h3{font-size:1.02rem;margin:1.2em 0 .3em}
article code{background:var(--code);padding:1px 6px;border-radius:5px;font:.88em ui-monospace,Menlo,Consolas,monospace}
article pre{background:var(--code);padding:14px;border-radius:8px;overflow-x:auto}
article pre code{padding:0;background:none}
article li{margin:.2em 0}
footer{margin-top:40px;color:var(--muted);font-size:.85rem}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Javier González Correa</h1>
  <p>Ciberseguridad IT &amp; OT · Writeups, laboratorios e informes técnicos</p>
  <div class="links"><a href="https://www.linkedin.com/in/javiglezprof/" target="_blank" rel="noopener">LinkedIn</a></div>
</header>

<div id="list">
  <div class="chips" id="chips"></div>
  <div id="cards"></div>
</div>

<div id="view" class="hidden">
  <a class="back" href="#inicio">← Volver</a>
  <article id="article"></article>
</div>

<footer>Las entradas marcadas como “Plantilla” son ejemplos de formato, no trabajos reales.</footer>
</div>

<script>
/* ===== AÑADE TUS INFORMES AQUÍ =====
   id: solo letras, números y guiones. content: Markdown sencillo. */
var WRITEUPS = [
{
 id:"plantilla-pentest", template:true, date:"2026-11-01", category:"Pentesting",
 title:"Pentest a una máquina vulnerable (plantilla)",
 summary:"Estructura recomendada para documentar una auditoría sobre una máquina de laboratorio.",
 tags:["Nmap","Burp Suite","Metasploit"],
 content:[
"## Resumen ejecutivo",
"Una o dos frases: objetivo, resultado y vulnerabilidad más crítica encontrada.",
"## Alcance y entorno",
"- **Objetivo:** nombre de la máquina o IP del laboratorio",
"- **Plataforma:** TryHackMe, HackTheBox o laboratorio propio",
"- **Herramientas:** `nmap`, Burp Suite, Metasploit",
"## Metodología",
"### 1. Reconocimiento",
"Explica qué buscabas y por qué elegiste ese escaneo.",
"```",
"nmap -sC -sV -p- 10.10.10.10",
"```",
"### 2. Explotación",
"Describe la vulnerabilidad, cómo la identificaste y cómo la explotaste.",
"### 3. Post-explotación",
"Escalada de privilegios y evidencias obtenidas.",
"## Hallazgos",
"- **Crítico:** descripción, impacto y evidencia",
"- **Medio:** descripción, impacto y evidencia",
"## Recomendaciones",
"Cómo se corregiría cada hallazgo, de más a menos prioritario.",
"## Lecciones aprendidas",
"Qué harías distinto y qué has aprendido."
].join("\n")
},
{
 id:"plantilla-segmentacion-ot", template:true, date:"2026-10-15", category:"OT/ICS",
 title:"Laboratorio de segmentación IT/OT (plantilla)",
 summary:"Plantilla de informe KT para documentar el diseño y la validación de una red segmentada.",
 tags:["IEC 62443","VLAN","Firewall"],
 content:[
"## Objetivo",
"Qué problema resuelve el laboratorio y qué se quería demostrar.",
"## Arquitectura",
"Incluye aquí un diagrama de red: zonas, conductos, firewall y direccionamiento.",
"- **Zona IT:** servicios corporativos",
"- **DMZ industrial:** servidores de intercambio",
"- **Zona OT:** PLC y SCADA",
"## Configuración",
"Reglas de firewall y VLAN relevantes, explicadas por qué existen.",
"## Validación",
"Pruebas realizadas para comprobar que el tráfico no permitido se bloquea.",
"## Relación con IEC 62443",
"Qué requisitos de zonas y conductos cubre el diseño.",
"## Lecciones aprendidas",
"Limitaciones del laboratorio y siguientes pasos."
].join("\n")
}
];

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function inline(s){return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")}
function md(src){
  var out=[],lines=src.split("\n"),inCode=false,inList=false;
  lines.forEach(function(l){
    if(l.indexOf("```")===0){
      if(inList){out.push("</ul>");inList=false}
      out.push(inCode?"</code></pre>":"<pre><code>");inCode=!inCode;return}
    if(inCode){out.push(esc(l));return}
    var m;
    if((m=l.match(/^(#{2,3}) (.*)/))){
      if(inList){out.push("</ul>");inList=false}
      out.push("<h"+m[1].length+">"+inline(m[2])+"</h"+m[1].length+">");return}
    if(l.indexOf("- ")===0){
      if(!inList){out.push("<ul>");inList=true}
      out.push("<li>"+inline(l.slice(2))+"</li>");return}
    if(inList){out.push("</ul>");inList=false}
    if(l.trim())out.push("<p>"+inline(l)+"</p>");
  });
  if(inList)out.push("</ul>");
  return out.join("\n");
}

var active="Todos";
function renderList(){
  var cats=["Todos"];
  WRITEUPS.forEach(function(w){if(cats.indexOf(w.category)<0)cats.push(w.category)});
  var chips=document.getElementById("chips");chips.innerHTML="";
  cats.forEach(function(c){
    var b=document.createElement("button");b.className="chip";b.textContent=c;
    b.setAttribute("aria-pressed",String(c===active));
    b.onclick=function(){active=c;renderList()};chips.appendChild(b)});
  var box=document.getElementById("cards");box.innerHTML="";
  WRITEUPS.filter(function(w){return active==="Todos"||w.category===active})
   .sort(function(a,b){return b.date.localeCompare(a.date)})
   .forEach(function(w){
    var a=document.createElement("a");a.className="card";a.href="#"+w.id;
    a.innerHTML="<h2>"+esc(w.title)+"</h2><p>"+esc(w.summary)+"</p><div class=\"meta\">"+
      (w.template?"<span class=\"badge\">Plantilla</span>":"")+
      "<span>"+esc(w.category)+"</span><span>·</span><span>"+esc(w.date)+"</span>"+
      w.tags.map(function(t){return "<span class=\"tag\">"+esc(t)+"</span>"}).join("")+"</div>";
    box.appendChild(a)});
}
function route(){
  var id=location.hash.slice(1),w=WRITEUPS.filter(function(x){return x.id===id})[0];
  var list=document.getElementById("list"),view=document.getElementById("view");
  if(w){
    list.classList.add("hidden");view.classList.remove("hidden");
    document.getElementById("article").innerHTML="<h1>"+esc(w.title)+"</h1><div class=\"meta\"><span>"+esc(w.category)+"</span><span>·</span><span>"+esc(w.date)+"</span>"+
      w.tags.map(function(t){return "<span class=\"tag\">"+esc(t)+"</span>"}).join("")+"</div>"+md(w.content);
    window.scrollTo(0,0);
  }else{view.classList.add("hidden");list.classList.remove("hidden")}
}
window.addEventListener("hashchange",route);
renderList();route();
</script>
</body>
</html>
